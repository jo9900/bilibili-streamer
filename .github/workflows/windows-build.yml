# Added by jo9900 (2026): test builds for Windows from feature branches.
name: Windows test build

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Build NSIS installer
        shell: bash
        run: npx tauri build --bundles nsis

      - name: Upload installer and portable exe
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-streamer-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
          if-no-files-found: error
